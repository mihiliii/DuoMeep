services:
    mongodb:
        image: mongo:7.0
        container_name: duomeep-mongodb
        restart: unless-stopped
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password123
            MONGO_INITDB_DATABASE: duomeep_db
        volumes:
            - mongodb_data:/data/db
        networks:
            - duomeep-network
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    flyway:
        build: ./containers/flyway
        container_name: duomeep-flyway
        command: -url=mongodb://admin:password123@mongodb:27017/duomeep_db?authSource=admin -locations=filesystem:/flyway/sql -sqlMigrationSuffixes=.js -validateMigrationNaming=true -baselineOnMigrate=true -baselineVersion=0 migrate
        volumes:
            - ./backend/src/db:/flyway/sql
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - duomeep-network

    backend:
        build: ./backend
        container_name: duomeep-backend
        restart: unless-stopped
        ports:
            - '4000:4000'
        environment:
            API_PORT: 4000
            MONGO_URI: mongodb://admin:password123@mongodb:27017/duomeep_db?authSource=admin
        depends_on:
            mongodb:
                condition: service_healthy
            flyway:
                condition: service_completed_successfully
        volumes:
            - ./backend/src:/app/src
            - ./backend/uploads:/app/uploads
            - ./backend/public:/app/public
        networks:
            - duomeep-network

    frontend:
        build: ./frontend
        container_name: duomeep-frontend
        restart: unless-stopped
        ports:
            - '5173:5173'
        environment:
            - VITE_API_URL=http://localhost:4000
        depends_on:
            - backend
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
            - ./frontend/index.html:/app/index.html
        networks:
            - duomeep-network

volumes:
    mongodb_data:
        driver: local

networks:
    duomeep-network:
        driver: bridge
